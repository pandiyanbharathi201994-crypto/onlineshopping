
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Shopping System</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            padding: 40px 20px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            color: white;

            margin-bottom: 35px;
        }


        .header h1 {
            font-size: 38px;

            margin-bottom: 10px;
        }


        .header p {
            font-size: 16px;

            opacity: 0.9;
        }


        /* =========================
           SHOPPING CARD
        ========================= */

        .shopping-card {

            max-width: 420px;

            margin: auto;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            transition: 0.3s;
        }


        .shopping-card:hover {

            transform: translateY(-8px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3);
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .product-image {

            height: 230px;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #f5f7ff,
                    #e8eaff
                );

            font-size: 100px;
        }


        /* =========================
           PRODUCT DETAILS
        ========================= */

        .product-details {

            padding: 30px;
        }


        .product-details h2 {

            font-size: 27px;

            color: #222;

            margin-bottom: 10px;
        }


        .description {

            color: #777;

            line-height: 1.6;

            margin-bottom: 15px;
        }


        .rating {

            color: #ffb400;

            margin-bottom: 15px;

            font-size: 18px;
        }


        .price {

            font-size: 30px;

            font-weight: bold;

            color: #667eea;

            margin-bottom: 25px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }


        button {

            border: none;

            padding: 14px 10px;

            border-radius: 12px;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 15px rgba(0, 0, 0, 0.2);
        }


        button:active {

            transform: scale(0.96);
        }


        .product-alert {

            background: #17a2b8;
        }


        .buy-product {

            background: #28a745;
        }


        .coupon {

            background: #ff9800;
        }


        .order-status {

            background: #e91e63;
        }


        /* =========================
           CUSTOM ALERT
        ========================= */

        #customAlert {

            display: none;

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            background: rgba(0, 0, 0, 0.6);

            justify-content: center;

            align-items: center;

            z-index: 1000;
        }


        .alert-box {

            width: 350px;

            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);

            animation: popup 0.3s ease;
        }


        .alert-icon {

            font-size: 55px;

            margin-bottom: 15px;
        }


        .alert-box h2 {

            color: #333;

            margin-bottom: 10px;
        }


        .alert-box p {

            color: #777;

            margin-bottom: 20px;
        }


        .ok-button {

            background: #667eea;

            width: 100%;
        }


        /* =========================
           ANIMATION
        ========================= */

        @keyframes popup {

            from {

                transform: scale(0.7);

                opacity: 0;
            }

            to {

                transform: scale(1);

                opacity: 1;
            }
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            text-align: center;

            color: white;

            margin-top: 30px;

            font-size: 14px;
        }


        /* =========================
           MEDIA QUERY
        ========================= */

        @media (max-width: 500px) {

            body {

                padding: 25px 15px;
            }


            .header h1 {

                font-size: 28px;
            }


            .shopping-card {

                width: 100%;
            }


            .product-image {

                height: 190px;

                font-size: 75px;
            }


            .product-details {

                padding: 22px;
            }


            .product-details h2 {

                font-size: 23px;
            }


            .price {

                font-size: 26px;
            }


            .buttons {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <h1>🛒 Online Shopping</h1>

        <p>Simple • Smart • Secure Shopping</p>

    </div>



    <!-- PRODUCT CARD -->

    <div class="shopping-card">


        <!-- PRODUCT IMAGE -->

        <div class="product-image">

            💻

        </div>



        <!-- PRODUCT DETAILS -->

        <div class="product-details">

            <h2>HP Laptop</h2>


            <p class="description">

                Powerful and stylish laptop for
                students, office work and daily use.

            </p>


            <div class="rating">

                ⭐⭐⭐⭐⭐
                <span style="color:#777;">
                    4.8/5
                </span>

            </div>


            <div class="price">

                ₹45,000

            </div>



            <!-- BUTTONS -->

            <div class="buttons">


                <button
                    class="product-alert"
                    onclick="showSimpleAlert()">

                    🔔 Product Alert

                </button>



                <button
                    class="buy-product"
                    onclick="showConfirm()">

                    🛒 Buy Product

                </button>



                <button
                    class="coupon"
                    onclick="showPrompt()">

                    🎟️ Enter Coupon

                </button>



                <button
                    class="order-status"
                    onclick="showCustomAlert()">

                    📦 Order Status

                </button>


            </div>

        </div>

    </div>



    <!-- CUSTOM ALERT -->

    <div id="customAlert">


        <div class="alert-box">


            <div class="alert-icon">

                📦

            </div>


            <h2>

                Order Ready!

            </h2>


            <p>

                Your HP Laptop order is
                ready for delivery.

            </p>


            <button
                class="ok-button"
                onclick="hideCustomAlert()">

                ✓ OK

            </button>


        </div>

    </div>



    <!-- FOOTER -->

    <div class="footer">

        © 2026 Online Shopping System

    </div>



    <script>


        // =========================
        // PRODUCT ALERT
        // =========================

        function showSimpleAlert() {

            alert(
                "🔔 New product is available!"
            );

        }



        // =========================
        // BUY PRODUCT
        // =========================

        function showConfirm() {

            let result = confirm(
                "🛒 Do you want to buy this HP Laptop?"
            );


            if (result) {

                alert(
                    "✅ Product added to your order!"
                );

            }

            else {

                alert(
                    "❌ You cancelled the order."
                );

            }

        }



        // =========================
        // COUPON
        // =========================

        function showPrompt() {

            let coupon = prompt(
                "🎟️ Enter your coupon code:"
            );


            if (coupon) {

                alert(
                    "✅ Coupon " +
                    coupon +
                    " applied successfully!"
                );

            }

            else {

                alert(
                    "⚠️ You didn't enter a coupon."
                );

            }

        }



        // =========================
        // CUSTOM ALERT
        // =========================

        function showCustomAlert() {

            document.getElementById(
                "customAlert"
            ).style.display = "flex";

        }



        function hideCustomAlert() {

            document.getElementById(
                "customAlert"
            ).style.display = "none";

        }

    </script>


</body>

</html>
